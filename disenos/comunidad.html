<main class="container page" style="gap:24px">

  <div class="row between">
    <div class="tabs" role="tablist" aria-label="Contenido de la comunidad" id="com-tabs" style="border:0">

    </div>
    <div class="row" id="com-sort-wrap"><label for="com-sort" class="small muted">Ordenar</label><select class="select" id="com-sort" style="min-height:44px;padding:8px 12px;background:var(--surface)"><option value="utiles">Más útiles</option><option value="recientes">Más recientes</option></select></div>
  </div>
  <div class="grid g-auto-300" id="com-list" aria-live="polite"></div>
  <a class="btn btn-primary" href="buscar-juegos.html" style="align-self:flex-start">Escribir una reseña</a>
