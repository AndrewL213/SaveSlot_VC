<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="img/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Amigos · SaveSlot</title>
<meta name="description" content="Tu lista de amigos: quién está en línea, qué están jugando, solicitudes y sugerencias.">
<meta name="theme-color" content="#12161D">
<link rel="icon" href="img/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap">
<link rel="stylesheet" href="css/styles.css">
</head>
<body data-page="amigos" data-section="perfil">

<main>
  <section class="page-hero" style="--c:#1F4A8A">
    <div class="container">
      <nav class="crumbs" aria-label="Ruta"><a href="perfil.html">Mi perfil</a><span aria-hidden="true">/</span><span style="color:var(--fg)">Amigos</span></nav>
      <div class="row between" style="align-items:flex-end;gap:24px">
        <div class="stack" style="gap:8px"><span class="eyebrow">Tu gente</span><h1 class="page-title">Amigos</h1><p class="soft" style="max-width:56ch">Mira quién está en línea, a qué están jugando y qué juegos tienen en común contigo.</p></div>
        <div class="hero-stats" id="f-stats"></div>
      </div>
    </div>
  </section>
  <div class="container page" style="padding-top:28px">
    <div class="split">
      <div class="main" style="gap:18px">
        <div class="row between" style="gap:12px">
          <div class="tabs" role="tablist" aria-label="Lista de amigos" id="f-tabs" style="border:0"></div>
          <label class="header-search field-search" style="flex:0 1 280px;min-height:44px"><span class="sr-only">Filtrar amigos</span><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#9AA8B8" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg><input id="f-q" type="search" list="sin-sugerencias" autocomplete="off" placeholder="Buscar por nombre o @usuario"></label>
        </div>
        <div class="grid g-auto-300" id="f-list" aria-live="polite"></div>
      </div>
      <aside class="side">
        <section class="panel">
          <h2 class="panel-title">Agregar amigo</h2>
          <form id="add-form" class="stack" style="gap:10px" novalidate>
            <label class="sr-only" for="add-u">Usuario</label>
            <input class="input" id="add-u" placeholder="@usuario" autocomplete="off">
            <span class="error-text" id="add-err" hidden></span>
            <button class="btn btn-primary" type="submit">Enviar solicitud</button>
          </form>
          <span class="xs muted">Tu usuario es <b class="soft" id="my-handle">@samluq</b> · <button type="button" class="help-link" id="copy-handle">Copiar</button></span>
        </section>
        <section class="panel"><h2 class="panel-title">Actividad de amigos</h2><div class="feed" id="feed"></div></section>
      </aside>
    </div>
  </div>
</main>
<script src="js/config.js"></script>
<script src="js/data.js"></script>
<script src="js/api.js"></script>
<script src="js/app.js"></script>
<script src="js/pages-juegos.js"></script>
<script src="js/pages-cuenta.js"></script>
<script src="js/pages-social.js"></script>
</body>
</html>
